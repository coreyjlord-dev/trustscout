[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustscout"
version = "0.1.0"
description = "Sandboxed marketplace listing checks with screenshot receipts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "openai>=1.50",
  "pillow>=10.4",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["fpdf2>=2.8", "pytest>=8", "ruff>=0.7"]
localguard = ["transformers>=4.44"]

[tool.setuptools.packages.find]
include = ["app*", "agent*", "sandbox*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["mockmarket", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: needs a local Docker daemon",
  "e2e: builds the Playwright image and screenshots the mock market",
]
